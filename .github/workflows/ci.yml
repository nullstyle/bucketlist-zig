name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: jdx/mise-action@v4
        with:
          version: 2026.8.14
      - run: just doctor
      - run: just fmt-check
      - run: just ci-lint
      - run: just vectors-check
      - run: just test
      - run: zig build test -Doptimize=ReleaseSafe --summary all
      - run: just wasm-diff
      - run: just wasm-verify
